<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 工具箱商店截图</title>
  <style>
    :root {
      --accent: #93c5fd;
      --accent-soft: rgba(147, 197, 253, 0.18);
      --accent-border: rgba(147, 197, 253, 0.36);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1280px;
      height: 800px;
      margin: 0;
      overflow: hidden;
      background: #0b1220;
    }

    body {
      color: #ffffff;
      font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 800px;
      padding: 58px 64px 54px;
      display: grid;
      grid-template-columns: 610px 1fr;
      gap: 46px;
      overflow: hidden;
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      z-index: -1;
    }

    .stage::before {
      width: 520px;
      height: 520px;
      right: -150px;
      top: -180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 66%);
    }

    .stage::after {
      width: 460px;
      height: 460px;
      left: -230px;
      bottom: -250px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.11), transparent 68%);
    }

    body[data-theme="overview"] .stage {
      background:
        radial-gradient(circle at 79% 15%, rgba(56, 189, 248, 0.3), transparent 28%),
        linear-gradient(135deg, #071225 0%, #102a5c 52%, #1746a2 100%);
    }

    body[data-theme="polish"] .stage {
      background:
        radial-gradient(circle at 82% 18%, rgba(251, 207, 232, 0.3), transparent 30%),
        linear-gradient(138deg, #250716 0%, #831843 48%, #be185d 100%);
      --accent: #fbcfe8;
      --accent-soft: rgba(251, 207, 232, 0.16);
      --accent-border: rgba(251, 207, 232, 0.34);
    }

    body[data-theme="reply"] .stage {
      background:
        radial-gradient(circle at 82% 16%, rgba(94, 234, 212, 0.25), transparent 29%),
        linear-gradient(138deg, #042f2e 0%, #115e59 50%, #0f766e 100%);
      --accent: #99f6e4;
      --accent-soft: rgba(153, 246, 228, 0.15);
      --accent-border: rgba(153, 246, 228, 0.33);
    }

    body[data-theme="devtools"] .stage {
      background:
        radial-gradient(circle at 82% 18%, rgba(165, 180, 252, 0.25), transparent 30%),
        linear-gradient(137deg, #070a13 0%, #111827 50%, #312e81 100%);
      --accent: #c7d2fe;
      --accent-soft: rgba(199, 210, 254, 0.14);
      --accent-border: rgba(199, 210, 254, 0.31);
    }

    body[data-theme="privacy"] .stage {
      background:
        radial-gradient(circle at 80% 18%, rgba(244, 114, 182, 0.22), transparent 28%),
        linear-gradient(136deg, #0b1220 0%, #172554 52%, #0f766e 100%);
      --accent: #f9a8d4;
      --accent-soft: rgba(249, 168, 212, 0.14);
      --accent-border: rgba(249, 168, 212, 0.31);
    }

    .copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.2));
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-meta {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow {
      width: fit-content;
      padding: 8px 13px;
      margin-bottom: 18px;
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    h1 {
      margin: 0;
      max-width: 610px;
      font-size: 48px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    h1 span { color: var(--accent); }

    .lead {
      max-width: 570px;
      margin: 22px 0 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 17px;
      line-height: 1.75;
    }

    .bullets {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }

    .bullet {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      line-height: 1.5;
    }

    .bullet-mark {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      border: 1px solid var(--accent-border);
      border-radius: 7px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .note {
      display: flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      margin-top: 34px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
    }

    .note::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent);
    }

    .visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .glow {
      position: absolute;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 70%);
      filter: blur(8px);
    }

    .device {
      position: relative;
      width: 412px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.23);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow:
        0 34px 72px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(18px);
    }

    .device-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding-left: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.44);
    }

    .device-screen {
      overflow: hidden;
      margin-top: 7px;
      border-radius: 22px;
      background: #f4f7fb;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    .device-screen img {
      display: block;
      width: 100%;
      height: auto;
    }

    .float-badge,
    .float-note {
      position: absolute;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(9, 15, 28, 0.56);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(16px);
    }

    .float-badge {
      top: 36px;
      right: 0;
      padding: 10px 14px;
      border-radius: 13px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }

    .float-badge::before {
      content: "✦";
      margin-right: 7px;
      color: var(--accent);
    }

    .float-note {
      left: 18px;
      bottom: -24px;
      padding: 9px 13px;
      border-radius: 11px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 11px;
    }

    .scene-index {
      position: absolute;
      right: 65px;
      bottom: 54px;
      z-index: 3;
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <header class="brand">
        <img src="../../icon128.png" alt="">
        <div>
          <div class="brand-name">AI 工具箱</div>
          <div class="brand-meta">Microsoft Edge Extension</div>
        </div>
      </header>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <div class="bullets" id="bullets"></div>
      <div class="note" id="note"></div>
    </section>

    <section class="visual">
      <div class="glow"></div>
      <div class="device">
        <div class="device-bar">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="device-screen">
          <img id="screenshot" alt="AI 工具箱扩展界面">
        </div>
      </div>
      <div class="float-badge" id="badge"></div>
      <div class="float-note" id="floatNote"></div>
    </section>
    <div class="scene-index" id="sceneIndex"></div>
  </main>

  <script>
    const scenes = {
      overview: {
        eyebrow: '10 项 AI 工具 · 一个弹窗',
        title: '写作、内容与开发，<br><span>一个扩展弹窗搞定</span>',
        lead: '从长文摘要、翻译润色到代码解释与报错诊断，选中文字即可开始。',
        bullets: [
          ['✦', '摘要 · 翻译 · 润色 · 校对 · 回复'],
          ['⌁', 'JSON · 测验 · FAQ · 代码 · 报错'],
          ['⌘', '支持划词右键和网页正文读取']
        ],
        note: 'Microsoft Edge · Manifest V3',
        badge: '10 项工具',
        floatNote: '使用自己的 API Key · 无需自建后端',
        image: 'popup-overview.png',
        index: '01 / 05'
      },
      polish: {
        eyebrow: '润色 · 5 种风格',
        title: '让同一段文字，<br><span>适合不同场景</span>',
        lead: '在正式专业、活泼口语、简洁干练、营销文案和学术严谨之间切换。',
        bullets: [
          ['1', '保持原意，不增加原文没有的信息'],
          ['2', '自动修正明显语病和标点问题'],
          ['3', '切换风格会自动清理旧结果']
        ],
        note: '营销文案 · 正式专业 · 学术严谨',
        badge: '5 种润色风格',
        floatNote: '切换风格，旧结果自动清理',
        image: 'popup-polish.png',
        index: '02 / 05'
      },
      reply: {
        eyebrow: '回复 · 4 种语气',
        title: '选中一条消息，<br><span>直接生成得体回复</span>',
        lead: '可附上关系、背景和回复目标，让模型输出可以直接发送的内容。',
        bullets: [
          ['✦', '礼貌正式 / 友好亲切'],
          ['✧', '简洁直接 / 委婉拒绝'],
          ['⌁', '右键选中消息即可调用']
        ],
        note: '只输出可直接发送的回复内容',
        badge: '4 种回复语气',
        floatNote: '选中消息 → 右键 → 写回复',
        image: 'popup-reply.png',
        index: '03 / 05'
      },
      devtools: {
        eyebrow: '代码解释 · 报错诊断',
        title: '代码和报错，<br><span>在浏览器里快速看懂</span>',
        lead: '粘贴代码、调用堆栈和错误信息，获得根因分析、排查步骤与修复建议。',
        bullets: [
          ['{ }', '解释核心逻辑和关键步骤'],
          ['!', '指出明显 bug、安全隐患和性能问题'],
          ['→', '按根因、排查步骤、修复建议输出']
        ],
        note: '不会实际运行代码 · 不编造不存在的日志',
        badge: '开发辅助',
        floatNote: '根因分析 · 修复建议',
        image: 'popup-devtools.png',
        index: '04 / 05'
      },
      privacy: {
        eyebrow: '本地设置 · 隐私可控',
        title: 'API Key 存本机，<br><span>处理过程清晰透明</span>',
        lead: '使用你自己的 DashScope Key；只有主动处理时，文本才会通过 HTTPS 发送给模型服务。',
        bullets: [
          ['✓', 'Key 保存在浏览器本地'],
          ['✓', '切换功能或清空内容会清理会话结果'],
          ['✓', '无统计、广告或用户画像 SDK']
        ],
        note: '仅申请必要权限 · 不申请 <all_urls>',
        badge: '隐私说明',
        floatNote: 'Key 仅存本机',
        image: 'popup-settings.png',
        index: '05 / 05'
      }
    };

    const sceneName = new URLSearchParams(location.search).get('scene') || 'overview';
    const scene = scenes[sceneName] || scenes.overview;
    document.body.dataset.theme = sceneName in scenes ? sceneName : 'overview';
    document.getElementById('eyebrow').textContent = scene.eyebrow;
    document.getElementById('title').innerHTML = scene.title;
    document.getElementById('lead').textContent = scene.lead;
    document.getElementById('note').textContent = scene.note;
    document.getElementById('badge').textContent = scene.badge;
    document.getElementById('floatNote').textContent = scene.floatNote;
    document.getElementById('sceneIndex').textContent = scene.index;
    document.getElementById('bullets').innerHTML = scene.bullets
      .map(([mark, text]) => `<div class="bullet"><span class="bullet-mark">${mark}</span><span>${text}</span></div>`)
      .join('');

    const image = document.getElementById('screenshot');
    image.addEventListener('load', () => {
      document.body.dataset.ready = 'true';
    }, { once: true });
    image.src = scene.image;
  </script>
</body>
</html>
